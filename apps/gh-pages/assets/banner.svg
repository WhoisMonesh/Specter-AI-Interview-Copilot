<svg width="960" height="320" viewBox="0 0 960 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090d"/>
      <stop offset="50%" stop-color="#0d111a"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>

    <!-- Glowing Orb Gradients -->
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#4facfe" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="brandCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="accentBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="960" height="320" rx="16" fill="url(#bgGradient)"/>
  <rect width="960" height="320" rx="16" fill="url(#grid)"/>

  <!-- Outer Glow Accent Border -->
  <rect x="1" y="1" width="958" height="318" rx="15" fill="none" stroke="url(#accentBorder)" stroke-width="1.5"/>

  <!-- Ambient Light Orbs -->
  <circle cx="170" cy="160" r="150" fill="url(#cyanGlow)"/>
  <circle cx="850" cy="80" r="160" fill="url(#purpleGlow)"/>

  <!-- Left Icon Emblem Container -->
  <g transform="translate(90, 75)">
    <!-- Outer Hex Glow Layer -->
    <circle cx="85" cy="85" r="75" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <circle cx="85" cy="85" r="68" fill="#090d16" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4" stroke-opacity="0.7"/>

    <!-- Mascot Ghost Icon -->
    <path d="M65 72 C65 60 74 50 85 50 C96 50 105 60 105 72 L105 106 L98 100 L91 106 L85 100 L79 106 L72 100 L65 106 Z" fill="url(#brandCyan)"/>
    <!-- Ghost Eyes -->
    <ellipse cx="78" cy="74" rx="3.5" ry="5" fill="#090d16"/>
    <ellipse cx="92" cy="74" rx="3.5" ry="5" fill="#090d16"/>
    <!-- AI Quantum Pulses -->
    <circle cx="85" cy="85" r="54" fill="none" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="85" cy="30" r="3" fill="#38bdf8"/>
    <circle cx="140" cy="85" r="3" fill="#a855f7"/>
    <circle cx="85" cy="140" r="3" fill="#38bdf8"/>
    <circle cx="30" cy="85" r="3" fill="#818cf8"/>
  </g>

  <!-- Right Typography & Content -->
  <g transform="translate(300, 72)">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="12" cy="13" r="4" fill="#10b981"/>
    <text x="24" y="17" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1">UNDETECTABLE COPILOT</text>

    <!-- Main Title -->
    <text x="0" y="66" fill="url(#titleGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">SPECTER <tspan fill="#38bdf8">AI</tspan></text>

    <!-- Subtitle -->
    <text x="0" y="98" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500">The Invisible Real-Time Interview &amp; Live Coding Assistant</text>

    <!-- Feature Pills Bar -->
    <g transform="translate(0, 126)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="138" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🛡️ Screen-Share Proof</text>

      <!-- Pill 2 -->
      <rect x="148" y="0" width="116" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="160" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">⚡ &lt;200ms Latency</text>

      <!-- Pill 3 -->
      <rect x="274" y="0" width="128" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="286" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🧠 Gemini 2.5 Pro</text>

      <!-- Pill 4 -->
      <rect x="412" y="0" width="180" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="424" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">⌘⇧S Instant OCR Solve</text>
    </g>

    <!-- Platforms Footer Tag -->
    <text x="2" y="180" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">Cross-Platform Native: <tspan fill="#94a3b8">macOS (Apple Silicon &amp; Intel)</tspan> • <tspan fill="#94a3b8">Windows 10/11</tspan> • <tspan fill="#94a3b8">Linux</tspan></text>
  </g>
</svg>
